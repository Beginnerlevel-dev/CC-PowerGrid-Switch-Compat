name: Auto Build and Release Mod JAR

on:
  push:
    branches:
      - main
  workflow_dispatch: # Enables the manual "Run workflow" button

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # Updated from v4 for Node 24 support
        with:
          fetch-depth: 2

      - name: Check if mod_version changed or manually triggered
        id: check_prop
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || git diff HEAD~1 HEAD -- gradle.properties | grep -E "^[+-]mod_version="; then
            echo "changed=true" >> $GITHUB_OUTPUT
            
            get_prop() {
              grep -E "^$1[[:space:]]*=" gradle.properties | cut -d'=' -f2- | xargs
            }

            echo "mod_version=$(get_prop mod_version)" >> $GITHUB_OUTPUT
            echo "mod_name=$(get_prop mod_name)" >> $GITHUB_OUTPUT
            echo "mc_version=$(get_prop minecraft_version)" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        if: steps.check_prop.outputs.changed == 'true'
        uses: actions/setup-java@v5 # Updated from v4 for Node 24 support
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Mod JAR
        if: steps.check_prop.outputs.changed == 'true'
        run: ./gradlew build

      - name: Create GitHub Release and Upload JAR
        if: steps.check_prop.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3 # Updated from v2 for Node 24 support
        with:
          tag_name: v${{ steps.check_prop.outputs.mod_version }}
          name: ${{ steps.check_prop.outputs.mod_name }} v${{ steps.check_prop.outputs.mod_version }} (MC ${{ steps.check_prop.outputs.mc_version }})
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          generate_release_notes: true
